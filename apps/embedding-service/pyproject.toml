[project]
name = "lotiva-embedding-service"
version = "0.2.0"
description = "Lotiva EmbeddingGemma self-hosted embedding service (768-d)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "sentence-transformers>=3.0.0",
  "torch>=2.2.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.0.0"]

[project.scripts]
lotiva-embedding = "app.main:run"
