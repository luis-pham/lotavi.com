# Hostinger shared VPS: keep nginx on 80/443 (Green Ruby).
# Lotavi binds localhost only; nginx reverse-proxies public hostnames.
services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.lotavi.com
        NEXT_PUBLIC_WEB_URL: https://lotavi.com
        NEXT_PUBLIC_SITE_ENV: production
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      NEXT_PUBLIC_API_URL: https://api.lotavi.com
      NEXT_PUBLIC_WEB_URL: https://lotavi.com
      NEXT_PUBLIC_SITE_ENV: production
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:4010:4000"
    environment:
      NODE_ENV: production
      LOTIVA_STORE: postgres
      ALLOW_MEMORY_STORE: "false"
      ALLOW_DEMO_SEED: "false"
      VOICE_ENABLED: "false"
      VOICE_TRANSPORT: "off"
      DIRECT_GEMINI_ENABLED: "false"
      DIRECT_GEMINI_STAGING_ACKNOWLEDGED: "false"
      VOICE_WRITE_TOOLS_ENABLED: "false"
      VOICE_RAG_TOOLS_ENABLED: "false"
      PUBLIC_WEB_URL: https://lotavi.com
      PUBLIC_API_URL: https://api.lotavi.com
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGINS: https://lotavi.com,https://www.lotavi.com,https://app.lotavi.com,https://api.lotavi.com
      EMBEDDING_SERVICE_URL: http://embedding-service:8081
      EMBEDDING_BACKEND: stub
      EMBEDDING_ALLOW_STUB: "true"
      REQUIRE_REDIS_RATE_LIMIT: "true"
      PUBLIC_APP_HOST: lotavi.com
      GUEST_COOKIE_NAME: lotiva_guest
      STAFF_COOKIE_NAME: lotiva_staff
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      embedding-service:
        condition: service_started
    entrypoint: ["/bin/sh", "/app/scripts/api-entrypoint.sh"]

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      LOTIVA_STORE: postgres
      ALLOW_MEMORY_STORE: "false"
      ALLOW_DEMO_SEED: "false"
      VOICE_ENABLED: "false"
      SESSION_SECRET: ${SESSION_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      EMBEDDING_SERVICE_URL: http://embedding-service:8081
      EMBEDDING_BACKEND: stub
      EMBEDDING_ALLOW_STUB: "true"
      REQUIRE_REDIS_RATE_LIMIT: "true"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  embedding-service:
    build:
      context: ../../apps/embedding-service
    environment:
      NODE_ENV: production
      EMBEDDING_BACKEND: stub
      EMBEDDING_ALLOW_STUB: "true"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - lotavi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  lotavi_pgdata:
