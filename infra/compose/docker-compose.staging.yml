# Production-like staging topology. Secrets must come from env/files — never demo defaults.
services:
  caddy:
    image: caddy:2.9-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: https://api.staging.lotavi.com
      NEXT_PUBLIC_WEB_URL: https://staging.lotavi.com
      NEXT_PUBLIC_SITE_ENV: staging
      # CSP Gemini connect-src only when verifying direct voice (never production):
      # NEXT_PUBLIC_DIRECT_GEMINI_CSP: "true"
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      # Use staging (not production) so V1.5 direct gates can apply when explicitly enabled.
      NODE_ENV: staging
      LOTIVA_STORE: postgres
      ALLOW_MEMORY_STORE: "false"
      ALLOW_DEMO_SEED: "false"
      # Safe defaults — V1.5 direct requires ALL of the following + GEMINI_API_KEY:
      VOICE_ENABLED: "false"
      VOICE_TRANSPORT: "off"
      DIRECT_GEMINI_ENABLED: "false"
      DIRECT_GEMINI_STAGING_ACKNOWLEDGED: "false"
      VOICE_WRITE_TOOLS_ENABLED: "false"
      VOICE_RAG_TOOLS_ENABLED: "false"
      PUBLIC_WEB_URL: https://staging.lotavi.com
      PUBLIC_API_URL: https://api.staging.lotavi.com
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGINS: https://staging.lotavi.com,https://app.lotavi.com,https://lotavi.com
      EMBEDDING_SERVICE_URL: http://embedding-service:8081
      EMBEDDING_BACKEND: model
      REQUIRE_REDIS_RATE_LIMIT: "true"
      PUBLIC_APP_HOST: staging.lotavi.com
      # Optional V1.5 enablement (fail-fast if incomplete):
      # VOICE_ENABLED: "true"
      # VOICE_TRANSPORT: direct
      # DIRECT_GEMINI_ENABLED: "true"
      # DIRECT_GEMINI_STAGING_ACKNOWLEDGED: "true"
      # DIRECT_GEMINI_PROPERTY_ALLOWLIST: "<property-uuid>"
      # GEMINI_API_KEY: ${GEMINI_API_KEY}
      # VOICE_HEARTBEAT_TTL_SECONDS: "90"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      embedding-service:
        condition: service_started
    entrypoint: ["/bin/sh", "/app/scripts/api-entrypoint.sh"]

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      LOTIVA_STORE: postgres
      ALLOW_MEMORY_STORE: "false"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      EMBEDDING_SERVICE_URL: http://embedding-service:8081
    restart: unless-stopped

  embedding-service:
    build:
      context: ../../apps/embedding-service
    environment:
      NODE_ENV: production
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-model}
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-}
      EMBEDDING_ALLOW_STUB: "false"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

volumes:
  pgdata_staging:
  caddy_data:
  caddy_config:
