# Install on Hostinger VPS:
#   /etc/nginx/conf.d/lotavi.com.conf
# Then: certbot --nginx -d lotavi.com -d www.lotavi.com -d app.lotavi.com -d api.lotavi.com

upstream lotavi_web {
  server 127.0.0.1:3010;
}

upstream lotavi_api {
  server 127.0.0.1:4010;
}

server {
  listen 80;
  listen [::]:80;
  server_name lotavi.com www.lotavi.com app.lotavi.com;

  location / {
    proxy_pass http://lotavi_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name api.lotavi.com;

  location / {
    proxy_pass http://lotavi_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
}
